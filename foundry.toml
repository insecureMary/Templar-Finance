[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.32"
via_ir = true
optimizer = true
optimizer_runs = 200


[fmt]
line_length = 200
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
sort_imports = true

[invariant]
runs = 256
depth = 256
fail_on_revert = false


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
